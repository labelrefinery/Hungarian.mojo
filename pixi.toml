[workspace]
name = "hungarian-mojo"
version = "0.1.0"
authors = ["Marius Seritan <marius@seritan.net>"]
description = "Jonker-Volgenant rectangular linear assignment in pure Mojo"
preview = ["pixi-build"]
channels = [
    "https://conda.modular.com/max-nightly",
    "conda-forge",
]
platforms = ["osx-arm64", "linux-64", "linux-aarch64"]

[dependencies]
mojo = "==1.0.0"

[tasks]
test = "mojo run -I src tests/test_hungarian.mojo"

# ── pixi-build: consumable as a pixi source dependency ──────────────────────
[package]
name = "hungarian-mojo"
version = "0.1.0"

[package.build]
backend = { name = "pixi-build-mojo", version = "0.*" }

[package.build.config.pkg]
path = "src/hungarian"
name = "hungarian"

[package.host-dependencies]
mojo-compiler = "==1.0.0"

[package.build-dependencies]
mojo-compiler = "==1.0.0"

[package.run-dependencies]
mojo-compiler = "==1.0.0"
